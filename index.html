<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debt Checker</title>

<style>
body{
font-family:Arial;
max-width:450px;
margin:auto;
padding:20px;
text-align:center;
}

input,button{
width:100%;
padding:10px;
margin:8px 0;
font-size:16px;
}

.box{
border:1px solid #ccc;
padding:15px;
border-radius:10px;
}

#adminPanel{
display:none;
margin-top:20px;
}
</style>
</head>

<body>

<h2>Check Your Balance</h2>

<div class="box">
<input id="search" placeholder="Enter username" width="418pX">
<button onclick="searchUser()">Search</button>
<div id="result"></div>
</div>

<hr>

<h3>Admin Login</h3>

<div class="box">
<input type="password" id="pass" placeholder="Admin password">
<button onclick="login()">Login</button>
</div>

<div id="adminPanel" class="box">

<h3>Admin Panel</h3>

<input id="name" placeholder="Customer name">
<input id="amount" placeholder="Amount">

<button onclick="updateUser()">Save</button>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlkHy6OQgRcKWzvtUgnWR_2QLJrHlpesbf1iQ7vTXcS1MW_CLhdfkRUHAIdvmpNIujRw/exec";

let data = [];

async function loadData(){
let res = await fetch(SCRIPT_URL);
data = await res.json();
}
loadData();

function searchUser(){
let name = document.getElementById("search").value.toLowerCase();

let user = data.find(u => u.name.toLowerCase() === name);

document.getElementById("result").innerHTML =
user ? "Amount Due: R" + user.amount : "Not found";
}

function login(){
let pass = document.getElementById("pass").value;

if(pass === "admin123"){
document.getElementById("adminPanel").style.display = "block";
alert("Logged in");
}else{
alert("Wrong password");
}
}

function updateUser(){
alert("⚠️ To update balances, you must edit your Google Sheet directly.\n\nThis version is read-only for safety.");
}

</script>

</body>
</html>
