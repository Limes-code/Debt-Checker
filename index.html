<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debt Checker</title>

<style>
body{
font-family:Arial;
max-width:450px;
margin:auto;
padding:20px;
text-align:center;
}

input,button{
width:100%;
padding:12px;
margin:8px 0;
font-size:16px;
}

.box{
border:1px solid #ccc;
padding:15px;
border-radius:10px;
}

#adminPanel{
display:none;
margin-top:20px;
}
</style>
</head>

<body style="background-color:#6F8FAF; width: 100%;  max-width: 450px; margin:auto; padding: 20px; text-align: left;">
<div style="text-align:center;">
  <img src="logo.jpg" alt="Logo" width="120">
</div>
<h2 align="center">Check Your Balance Owed to Limes</h2>

<div class="box">
<input id="search" placeholder="Enter username" style="width: 93%;">
<button onclick="searchUser()"  style="width: 100%;">Search</button>
<div id="result"></div>
</div>

<hr>

<h3 align="center">Admin Login</h3>

<div class="box">
<input type="password" id="pass" placeholder="Admin password" style="width: 93%;">
<button onclick="login()" style="width: 100%;">Login</button>
</div>

<div id="adminPanel" class="box">

<h3>Admin Panel</h3>

<input id="name" placeholder="Customer name">
<input id="amount" placeholder="Amount">

<button onclick="updateUser()">Save</button>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlkHy6OQgRcKWzvtUgnWR_2QLJrHlpesbf1iQ7vTXcS1MW_CLhdfkRUHAIdvmpNIujRw/exec";

let data = [];

async function loadData(){
let res = await fetch(SCRIPT_URL);
data = await res.json();
}
loadData();

function searchUser(){
let name = document.getElementById("search").value.toLowerCase();

let user = data.find(u => u.name.toLowerCase() === name);

document.getElementById("result").innerHTML =
user ? "Amount owned to the owner: R" + user.amount : "Not found";
}

function login() {
    let pass = document.getElementById("pass").value;
    if (pass === "VWisking@1012") {
        // Open Google Sheet in a new tab
        window.open('https://docs.google.com/spreadsheets/d/17DZSObfIz64oeId5WdkTFqG6tHBytvs7kjwYfENzSus/edit?usp=sharing', '_blank');
    } else {
        alert("Wrong password");
    }
}

async function updateUser() {
    let name = document.getElementById("name").value.trim();
    let amount = document.getElementById("amount").value.trim();

    if (!name || amount === "") {
        alert("Please enter both name and amount.");
        return;
    }

    let url = SCRIPT_URL + "?name=" + encodeURIComponent(name) + "&amount=" + encodeURIComponent(amount);

    let response = await fetch(url);

    if (response.ok) {
        let result = await response.text();
        alert(result);  // Should show "Saved"
        loadData();  // Refresh customer data on the page
    } else {
        alert("Error saving data.");
    }
}

</script>

</body>
</html>
